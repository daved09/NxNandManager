name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw64/mingw-w64-x86_64-qt5-static
      - name: build
        shell: msys2 {0}
        run: |
          ln -s $(pwd) ~/NxNandManager
          cd ~/NxNandManager/NxNandManager/gui
          /mingw64/qt5-static/bin/qmake.exe NxNandManager.pro 'CONFIG += STATIC ARCH64'
          make -j"$(nproc)"
          mkdir -p $GITHUB_WORKSPACE/bin
          cp release/NxNandManager.exe $GITHUB_WORKSPACE/bin
          cp ../virtual_fs/dokan/x64/dokan1.dll $GITHUB_WORKSPACE/bin
      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager
          path: bin/*
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential qtbase5-dev qt5-qmake libssl-dev
      - name: build CLI
        run: |
          cd NxNandManager
          make -j"$(nproc)"
          mkdir -p $GITHUB_WORKSPACE/bin-linux
          cp NxNandManager $GITHUB_WORKSPACE/bin-linux/NxNandManager-cli
      - name: build GUI
        run: |
          mkdir -p build-gui && cd build-gui
          qmake ../NxNandManager/gui/NxNandManager.pro
          make -j"$(nproc)"
          cp NxNandManager $GITHUB_WORKSPACE/bin-linux/NxNandManager
      - uses: actions/upload-artifact@v4
        with:
          name: NxNandManager-linux
          path: bin-linux/*
